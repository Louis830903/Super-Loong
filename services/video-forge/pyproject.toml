[project]
name = "video-forge"
version = "0.1.0"
description = "Video-Forge — 轻量 Python 视频微服务（super-agent 子进程）"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    # 数据校验
    "pydantic>=2.0.0",
    # 媒体处理
    "ffmpeg-python>=0.2.0",
    "moviepy==1.0.3",
    "pillow>=10.0.0,<12",
    # ComfyUI 工作流引擎
    "comfykit>=0.1.12",
    # TTS
    "edge-tts==7.2.7",
    # 浏览器自动化（帧合成用）
    "playwright>=1.58.0",
    # HTTP 客户端
    "httpx>=0.28.1",
    # 工具库
    "beautifulsoup4>=4.14.2",
    "loguru>=0.7.0",
    "pyyaml>=6.0.0",
    "certifi>=2025.10.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
