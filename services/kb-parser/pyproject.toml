[project]
name = "kb-parser"
version = "0.1.0"
description = "KB-Parser — Docling 驱动的知识库进阶解析 sidecar（super-agent 子进程）"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    # 进阶解析引擎（IBM Docling，扫描件 OCR / 复杂版式 PDF / 图片）
    #   锁 >=2.0,<3.0：2.x 是当前稳定主线，API 与本 sidecar 对齐
    "docling>=2.0,<3.0",
    # 日志
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.28.1",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 单文件 main.py，不作为包分发
packages = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
